name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:   # allows the workflow to read repo contents (no write needed for this option)
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  web:
    name: Web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run web tests
        working-directory: web
        run: npm test

  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3    # pin to your local version

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt (auto-format if check fails)
        run: forge fmt --check || (forge fmt && echo "Code auto-formatted 🚀")
        id: fmt

      - name: Run Forge build
        run: forge build --sizes
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test
