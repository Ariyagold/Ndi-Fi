version: '3.8'

services:
  # Foundry / Ethereum Local Node
  foundry:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: ndifi-foundry
    ports:
      - "8545:8545"
    env_file:
      - .env
    environment:
      - FOUNDRY_ETH_RPC_URL=http://0.0.0.0:8545
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --block-time 12
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ndifi-network
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./script:/app/script
      - ./lib:/app/lib
      - ./foundry.toml:/app/foundry.toml
      - ./remappings.txt:/app/remappings.txt

  # Stellar Soroban Local Network
  stellar:
    image: stellar/soroban-dev:latest
    container_name: ndifi-stellar
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STELLAR_NETWORK_PASSPHRASE=Standalone Network ; February 2017
    command: >
      sh -c "
        stellar-soroban-rpc start --port 8000 --rpc-url http://0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ndifi-network
    volumes:
      - ./stellar:/app/stellar

  # Web Application (placeholder - add your web app here)
  web:
    image: node:18-alpine
    container_name: ndifi-web
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FOUNDRY_ETH_RPC_URL=http://foundry:8545
      - STELLAR_RPC_URL=http://stellar:8000
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ndifi-network
    depends_on:
      foundry:
        condition: service_healthy
      stellar:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

networks:
  ndifi-network:
    driver: bridge
